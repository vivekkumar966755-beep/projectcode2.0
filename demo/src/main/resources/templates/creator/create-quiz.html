<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Create quiz · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AQ</span>
        <span>Apex Quiz</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/quizzes}">Quizzes</a>
        <a class="active" th:href="@{/creator/dashboard}">Creator</a>
        <a th:href="@{/participant/history}">History</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="linkish" type="submit">Sign out</button>
        </form>
    </nav>
</header>
<main class="page">
    <div class="card" style="max-width:620px; margin:auto;">
        <div class="kicker">
            <span class="kicker-dot"></span>
            <span>New assessment</span>
        </div>
        <h2>Create a quiz</h2>
        <p class="muted">It will stay in review until an administrator publishes it.</p>
        <form th:action="@{/creator/quizzes/create}" method="post" th:object="${quiz}" class="form-grid" style="margin-top:20px;">
            <div>
                <label for="title">Title</label>
                <input id="title" type="text" th:field="*{title}" required placeholder="Java Collections Mastery"/>
            </div>
            <div>
                <label for="duration">Duration (minutes)</label>
                <input id="duration" type="number" th:field="*{duration}" min="1" required value="15"/>
            </div>
            <div style="display:flex; gap:12px; margin-top:8px;">
                <button class="btn" type="submit">Save and add questions &rarr;</button>
                <a class="btn secondary" th:href="@{/creator/dashboard}">Cancel</a>
            </div>
        </form>
    </div>
</main>
<footer class="footer">
    Apex Quiz · Role-based assessments for teams that take learning seriously.
</footer>
</body>
</html>
