<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>My quizzes · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AQ</span>
        <span>Apex Quiz</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/quizzes}">Quizzes</a>
        <a class="active" th:href="@{/creator/dashboard}">Creator</a>
        <a th:href="@{/participant/history}">History</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="linkish" type="submit">Sign out</button>
        </form>
    </nav>
</header>
<main class="page">
    <div class="card">
        <div class="toolbar">
            <div>
                <div class="kicker">
                    <span class="kicker-dot"></span>
                    <span>Library</span>
                </div>
                <h2>Quizzes you authored</h2>
            </div>
            <a class="btn" th:href="@{/creator/quizzes/create}">+ Create quiz</a>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Title</th>
                    <th>Duration</th>
                    <th>Status</th>
                    <th style="text-align:right;">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="quiz : ${quizzes}">
                    <td><strong th:text="${quiz.title}">Title</strong></td>
                    <td class="muted"><span th:text="${quiz.duration}">15</span> min</td>
                    <td>
                        <span class="badge" th:classappend="${quiz.status.name() == 'APPROVED' ? 'ok' : (quiz.status.name() == 'REJECTED' ? 'danger' : 'warn')}" th:text="${quiz.status}">STATUS</span>
                    </td>
                    <td style="text-align:right;">
                        <a class="btn ghost" th:href="@{'/creator/quizzes/' + ${quiz.id} + '/add-questions'}" style="padding:6px 14px; font-size:12px;">Questions &rarr;</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(quizzes)}">
                    <td colspan="4" class="empty">You have not created a quiz yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="footer">
    Apex Quiz · Role-based assessments for teams that take learning seriously.
</footer>
</body>
</html>
