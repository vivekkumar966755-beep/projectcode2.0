<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Creator studio · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AQ</span>
        <span>Apex Quiz</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/quizzes}">Quizzes</a>
        <a class="active" th:href="@{/creator/dashboard}">Creator</a>
        <a th:href="@{/participant/history}">History</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="linkish" type="submit">Sign out</button>
        </form>
    </nav>
</header>
<main class="page">
    <div class="kicker">
        <span class="kicker-dot"></span>
        <span>Creator studio</span>
    </div>
    <h1>Compose and ship <span class="highlight">assessments.</span></h1>
    <div class="stats">
        <div class="stat"><span>Your quizzes</span><strong th:text="${quizCount}">0</strong></div>
        <div class="stat"><span>Pending review</span><strong th:text="${pendingCount}">0</strong></div>
        <div class="stat"><span>Published</span><strong th:text="${approvedCount}">0</strong></div>
        <div class="stat"><span>Workspace</span><strong style="color:var(--accent);">Live</strong></div>
    </div>
    <div class="actions">
        <a class="btn" th:href="@{/creator/quizzes/create}">New quiz &rarr;</a>
        <a class="btn secondary" th:href="@{/creator/quizzes}">My library</a>
    </div>
</main>
<footer class="footer">
    Apex Quiz · Role-based assessments for teams that take learning seriously.
</footer>
</body>
</html>
