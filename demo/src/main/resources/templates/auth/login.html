<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sign in · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="auth-wrap">
    <div class="auth-card">
        <a th:href="@{/}" style="display:inline-flex; align-items:center; gap:10px; margin-bottom:24px; color:var(--text-muted); font-size:13px; font-weight:600;">
            <span class="brand-mark" style="width:28px; height:28px; font-size:11px; border-radius:8px;">AQ</span>
            <span>Apex Quiz</span>
        </a>
        <div class="kicker">
            <span class="kicker-dot"></span>
            <span>Welcome back</span>
        </div>
        <h2>Sign in to Apex Quiz</h2>
        <p class="muted">Use the email you registered with.</p>
        <div th:if="${param.error}" class="notice error">
            Invalid email or password.
        </div>
        <div th:if="${param.logout}" class="notice ok">
            You have been signed out.
        </div>
        <form th:action="@{/login}" method="post" class="form-grid" style="margin-top:20px;">
            <div>
                <label for="username">Email</label>
                <input id="username" type="email" name="username" placeholder="you@company.com" required/>
            </div>
            <div>
                <label for="password">Password</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required/>
            </div>
            <button class="btn" type="submit" style="width:100%; margin-top:8px;">Continue &rarr;</button>
        </form>
        <p class="muted" style="margin-top:24px; text-align:center; font-size:14px;">
            New here? <a th:href="@{/register}" style="font-weight:600;">Create an account</a>
        </p>
        <div style="margin-top:20px; padding:12px; background:rgba(241,245,249,0.7); border-radius:12px; font-size:12px; color:var(--text-muted); text-align:center;">
            Seed admin: <strong>admin@quizplatform.local</strong>
        </div>
    </div>
</body>
</html>
