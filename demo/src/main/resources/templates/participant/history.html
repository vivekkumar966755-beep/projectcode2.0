<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>History · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AQ</span>
        <span>Apex Quiz</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/quizzes}">Quizzes</a>
        <a class="active" th:href="@{/participant/history}">History</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="linkish" type="submit">Sign out</button>
        </form>
    </nav>
</header>
<main class="page">
    <div class="card">
        <div class="toolbar">
            <div>
                <div class="kicker">
                    <span class="kicker-dot"></span>
                    <span>Transcript</span>
                </div>
                <h2>Your assessment history</h2>
            </div>
            <a class="btn" th:href="@{/quizzes}">Take a quiz &rarr;</a>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Assessment Title</th>
                    <th>Score</th>
                    <th>Accuracy</th>
                    <th style="text-align:right;">Attempt Date</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="res : ${results}">
                    <td><strong th:text="${res.quiz != null ? res.quiz.title : '—'}">Quiz</strong></td>
                    <td>
                        <span class="badge ok" style="font-weight:700;">
                            <span th:text="${res.score}">0</span> / <span th:text="${res.totalQuestions}">0</span>
                        </span>
                    </td>
                    <td class="muted">
                        <span style="font-weight:600; color:var(--text-main);">
                            <span th:text="${res.totalQuestions > 0 ? (res.score * 100 / res.totalQuestions) : 0}">0</span>%
                        </span>
                    </td>
                    <td class="muted" style="text-align:right;" th:text="${#temporals.format(res.takenAt, 'dd MMM yyyy HH:mm')}">Date</td>
                </tr>
                <tr th:if="${#lists.isEmpty(results)}">
                    <td colspan="4" class="empty">No attempts yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer class="footer">
    Apex Quiz · Role-based assessments for teams that take learning seriously.
</footer>
</body>
</html>
