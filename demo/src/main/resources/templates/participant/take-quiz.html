<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Take quiz · Apex Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>
<body class="app-shell">
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">AQ</span>
        <span>Apex Quiz</span>
    </a>
    <nav class="nav-links">
        <a th:href="@{/}">Home</a>
        <a class="active" th:href="@{/quizzes}">Quizzes</a>
        <a th:href="@{/participant/history}">History</a>
        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button class="linkish" type="submit">Sign out</button>
        </form>
    </nav>
</header>
<main class="page">
    <div class="card">
        <div class="toolbar">
            <div>
                <div class="kicker">
                    <span class="kicker-dot"></span>
                    <span>Timed attempt</span>
                </div>
                <h2 th:text="${quiz.title}">Quiz Title</h2>
            </div>
            <div class="timer-pill">
                <span class="muted" style="font-size:13px;">Time left:</span>
                <strong th:attr="data-duration-minutes=${quiz.duration}">--:--</strong>
            </div>
        </div>
        <form th:action="@{'/quizzes/' + ${quiz.id} + '/submit'}" method="post" data-auto-submit>
            <div th:each="question, iter : ${quiz.questions}" class="question-card">
                <p style="margin: 0 0 16px; font-size:15px;">
                    <strong><span th:text="${iter.count}">1</span>. <span th:text="${question.questionText}">Question</span></strong>
                </p>
                <div style="display:flex; flex-direction:column; gap:6px;">
                    <label class="choice">
                        <input type="radio" th:name="'question_' + ${question.id}" value="A" required/>
                        <span><strong>A.</strong> <span th:text="${question.optionA}">Option A</span></span>
                    </label>
                    <label class="choice">
                        <input type="radio" th:name="'question_' + ${question.id}" value="B"/>
                        <span><strong>B.</strong> <span th:text="${question.optionB}">Option B</span></span>
                    </label>
                    <label class="choice">
                        <input type="radio" th:name="'question_' + ${question.id}" value="C"/>
                        <span><strong>C.</strong> <span th:text="${question.optionC}">Option C</span></span>
                    </label>
                    <label class="choice">
                        <input type="radio" th:name="'question_' + ${question.id}" value="D"/>
                        <span><strong>D.</strong> <span th:text="${question.optionD}">Option D</span></span>
                    </label>
                </div>
            </div>
            <div style="margin-top:28px;">
                <button class="btn" type="submit">Submit assessment &rarr;</button>
            </div>
        </form>
    </div>
</main>
<footer class="footer">
    Apex Quiz · Role-based assessments for teams that take learning seriously.
</footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
